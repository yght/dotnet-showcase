version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
  - package-ecosystem: "nuget"
    directory: "/modern/Messaging.Api"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
  - package-ecosystem: "nuget"
    directory: "/modern/Messaging.Tests"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
